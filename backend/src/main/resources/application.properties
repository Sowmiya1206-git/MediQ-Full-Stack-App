server.port=8080
# ---- Development: H2 (default) ----
spring.datasource.url=jdbc:h2:file:./data/mediq;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
# ---- Production: MySQL (uncomment) ----
#spring.datasource.url=jdbc:mysql://localhost:3306/mediq?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=changeme
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
app.jwt.secret=change-this-secret-key-to-at-least-32-characters-long!!
app.jwt.expiration-ms=86400000
app.cors.origin=http://localhost:4200
app.cancel.min-hours-before=1
spring.mvc.format.date=iso
spring.mvc.format.time=iso
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
